name: ci

# 门禁的唯一执法点。破坏点表（scripts/breakpoints.ts）不进 npm 包——它要 src/ 与 test/
# 才能跑，装到用户机器上是个死脚本。所以「验证纪律跟出去」靠这里：每次 push/PR 全跑，
# 发布只从跑绿的 tag 出，并且带 provenance 把 tarball 绑到 commit 与 workflow。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      # dist 入库了，但 CI 仍要重建一次：确认入库的产物与源码一致（防陈旧）
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:check
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      # 真机样本和文档示例最会把作者的家目录/密钥带出来——扫入库文件，命中就红
      - run: pnpm check:privacy
      # 322 条破坏点逐个改源码再复原：必须单 job 串行，不能和别的变异测试并行
      - run: pnpm check:breakpoints
      # 故意不跑 pnpm mutate：本机实测 57 分钟（1291 个位点）。
      # 它是发版前的人工门禁（AGENTS「只能本地」），CI 不替它把关。

  publish:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 用 npm trusted publishing：workflow 在 npmjs.com 上注册为这个包的 trusted
    # publisher，用 GitHub 的 OIDC token 认证，不需要长期 NPM_TOKEN。
    #   前提：① 仓库公开（attestation 要求）；② npmjs.com 上给 @goodali/pi-dispatch
    #   配好 trusted publisher（包名 + workflow 名 + repo）。
    # tag 就是这次发布的身份：它指着 tarball 构建自的那个 commit，tag 与
    # package.json 对不上就拒绝发布。
    permissions:
      contents: read
      id-token: write # trusted publishing 的 OIDC 换 token 要它
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 是钉死的而非 lts/*：trusted publishing 需要 npm CLI >= 11.5.1
          node-version: 24
          # 不设 registry-url：它会往 .npmrc 写一个占位 _authToken，
          # 把 OIDC 兑换失败变成 PUT 上的误导性 404
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: 校验 tag 与 package.json 的版本一致
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG 与 package.json 版本 $version 不一致" >&2
            exit 1
          fi
      - run: pnpm build
      # prepublishOnly 在这里再跑一遍廉价门禁：tag 是人打的，别信上一次 run
      # prepack 必须在 publish 之前单独跑一次：npm 校验 bin 字段是在读 manifest 时做的，
      # 那时 lifecycle 脚本还没执行——新 clone 没有 dist 时它会先报警再发。
      - run: npm run prepack
      # trusted publishing 下 npm 自动生成 attestation，不需要 --provenance
      - run: npm publish --access public --loglevel verbose
